<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Service worker reset</title>
<style>
  :root {
    --bg: #f6f7f9;
    --fg: #1b1f24;
    --muted: #5b6570;
    --panel: #ffffff;
    --line: #d9dee4;
    --ok: #1a7f4b;
    --err: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a;
      --fg: #e8ebee;
      --muted: #9aa4ae;
      --panel: #1c2024;
      --line: #2e353c;
      --ok: #4cc38a;
      --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 2rem 1rem;
  }
  main { max-width: 36rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p.lead { color: var(--muted); margin: 0 0 1.5rem; }
  #status { font-weight: 600; margin-bottom: 1rem; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  ul { list-style: none; margin: 0 0 1.5rem; padding: 0; }
  li {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: .6rem .8rem;
    margin-bottom: .5rem;
    overflow-wrap: anywhere;
    font-size: .9rem;
  }
  button {
    font: inherit;
    padding: .55rem 1rem;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--fg);
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--ok); outline-offset: 2px; }
  small { display: block; color: var(--muted); margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
  <h1>Service worker reset</h1>
  <p class="lead">Removes every service worker registered on <strong id="origin"></strong>. IndexedDB, localStorage, and cookies are left alone.</p>

  <div id="status" role="status" aria-live="polite">Working…</div>
  <ul id="log"></ul>
  <button id="again" type="button">Run again</button>

  <small>Service workers that are currently controlling a page may keep running until that page is closed. Reload any other tabs on this site afterward.</small>
</main>

<script>
(function () {
  var statusEl = document.getElementById('status');
  var logEl = document.getElementById('log');
  document.getElementById('origin').textContent = location.origin;

  function log(msg) {
    var li = document.createElement('li');
    li.textContent = msg;
    logEl.appendChild(li);
  }

  function setStatus(msg, cls) {
    statusEl.textContent = msg;
    statusEl.className = cls || '';
  }

  async function run() {
    logEl.textContent = '';
    setStatus('Working…');

    if (!('serviceWorker' in navigator)) {
      setStatus('Service workers are not supported in this browser.', 'err');
      return;
    }

    try {
      // Returns every registration on this origin (all scopes).
      var regs = await navigator.serviceWorker.getRegistrations();

      if (!regs.length) {
        setStatus('No service workers found on this origin.', 'ok');
        return;
      }

      var removed = 0;
      for (var i = 0; i < regs.length; i++) {
        var reg = regs[i];
        var scope = reg.scope;
        try {
          var ok = await reg.unregister();
          log((ok ? 'Unregistered: ' : 'Not removed: ') + scope);
          if (ok) removed++;
        } catch (e) {
          log('Failed: ' + scope + ' (' + e.message + ')');
        }
      }

      setStatus(
        'Removed ' + removed + ' of ' + regs.length + ' service worker' + (regs.length === 1 ? '' : 's') + '.',
        removed === regs.length ? 'ok' : 'err'
      );
    } catch (e) {
      setStatus('Could not clear service workers: ' + e.message, 'err');
    }
  }

  document.getElementById('again').addEventListener('click', run);
  run();
})();
</script>
</body>
</html>
