const MARK='<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6aaeff"/><stop offset=".55" stop-color="#1565d8"/><stop offset="1" stop-color="#0b3fa8"/></linearGradient><linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d9e4f8"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#lg)"/><path d="M32 22c-5-3-12-4-18-3v26c6-1 13 0 18 3 5-3 12-4 18-3V19c-6-1-13 0-18 3z" fill="url(#lg2)"/><path d="M32 22v26" stroke="#1565d8" stroke-width="2.5" stroke-linecap="round"/><path d="M47 8l1.7 4.6L53.3 14l-4.6 1.7L47 20.3l-1.7-4.6L40.7 14l4.6-1.4z" fill="#fff"/></svg>';

 const done=v=>{const val=d.querySelector('textarea')?.value;d.remove();removeEventListener('keydown',k);res({ok:v,val})},k=e=>e.key==='Escape'&&done(false);

/* ---- Markdown blocks (lists, quotes, tables, code, h3/h4, rules) ---- */
function md(s){const L=s.split('\n');let o='',i=0,p=[];const fp=()=>{if(p.length){o+=`<p>${fmt(p.join(' '))}</p>`;p=[]}},row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
 while(i<L.length){const l=L[i];let m;
  if(l.startsWith('```')){fp();const c=[];i++;while(i<L.length&&!L[i].startsWith('```'))c.push(L[i++]);i++;o+=`<pre class="cb">${esc(c.join('\n'))}</pre>`;continue}

  if(/^[-*]\s/.test(l)||/^\d+[.)]\s/.test(l)){fp();const ol=/^\d/.test(l),r=ol?/^\d+[.)]\s/:/^[-*]\s/,it=[];while(i<L.length&&r.test(L[i]))it.push(L[i++].replace(r,''));const t=ol?'ol':'ul';o+=`<${t}>${it.map(x=>`<li>${fmt(x)}</li>`).join('')}</${t}>`;continue}
  if(l.startsWith('> ')){fp();const b=[];while(i<L.length&&L[i].startsWith('> '))b.push(L[i++].slice(2));o+=`<blockquote>${fmt(b.join(' '))}</blockquote>`;continue}

  p.push(l);i++}
 fp();return o}

/* ---- AI article prompt ---- */
const AIP=()=>['You are helping me write an encyclopedia article for Reitcyclopedia, a free community encyclopedia.','','STEP 1: Ask me what the subject is and what I want included. Wait for my reply.','STEP 2: Write the article and reply with ONLY one JSON code block and nothing else, in exactly this shape:','','{"title":"...","type":"Person|Place|Organization|Concept|Event|General","summary":"...","infobox":[["Label","Value"]],"blocks":[{"t":"h","x":"Heading"},{"t":"p","x":"Paragraph text"},{"t":"l","x":"item one\\nitem two"},{"t":"c","h":"Dropdown title","x":"Hidden text"}]}','','RULES:','- Neutral, factual, encyclopedic tone. Do not invent facts. If unsure, leave it out.','- summary: 40-500 characters, 1-3 sentences, no headings.','- infobox: short label/value rows. Suggested labels by type: '+Object.entries(TPL).map(([k,v])=>k+' ('+(v.join(', ')||'any relevant facts')+')').join('; ')+'. Add other useful rows.','- blocks: at least 3 headings (t "h"), each followed by content. At least 150 characters of body text in total, and under 30,000 characters overall.','- Block types: h = heading, p = paragraph (Markdown allowed), l = bullet list (one item per line, joined with \\n), c = collapsible dropdown (h = its title, x = its Markdown content).','- Markdown allowed in text: **bold**, *italic*, ~~strike~~, ==highlight==, `code`, [text](https://url), [[Other Article Title]] for links to other articles, "- " bullets, "1. " numbered lines, "> " quotes, | pipe | tables |, and ``` code fences.','- No images. The JSON must be valid: escape double quotes and use \\n for line breaks.'].join('\n');

function parseAI(t){const m=t.match(/```(?:json)?\s*([\s\S]*?)```/);let s=(m?m[1]:t).trim();s=s.slice(s.indexOf('{'),s.lastIndexOf('}')+1);const o=JSON.parse(s);
 if(!o.title||!o.summary||!Array.isArray(o.blocks))throw Error('The reply is missing a title, summary or blocks.');
 return{title:String(o.title).slice(0,120),type:TPL[o.type]?o.type:'General',summary:String(o.summary),infobox:(o.infobox||[]).filter(r=>Array.isArray(r)&&r[0]&&r[1]).map(r=>[String(r[0]),String(r[1])]),blocks:o.blocks.filter(b=>['h','p','l','c'].includes(b.t)&&b.x!=null).map(b=>({t:b.t,x:String(b.x),...(b.t==='c'?{h:String(b.h||'More')}:{})}))}}

/* ---- compression: JSON -> gzip -> base64 ---- */
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s)};
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const pipe=async(d,T)=>new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new T('gzip'))).arrayBuffer());
const pack=async o=>b64(await pipe(JSON.stringify(o),CompressionStream));
const unpack=async s=>JSON.parse(new TextDecoder().decode(await pipe(unb(s),DecompressionStream)));

 const r=await getDocs(query(collection(db,'edits'),where('status','==','pending'),limit(20)));
 if(r.empty)return q('#rv').innerHTML='<p class="mu">No pending edits.</p>';
 q('#rv').innerHTML='';
 for(const d of r.docs){const e=d.data(),cur=await load(e.slug),n=await unpack(e.body),box=document.createElement('div');box.className='blk';
  const stale=cur&&cur.rev!==e.baseRev;
  box.innerHTML=`<b><a href="#/a/${e.slug}">${esc(e.title)}</a></b> <span class="mu">by ${esc(e.authorName)} · based on rev ${e.baseRev}</span>${stale?`<div class="err">Stale: the article is now at rev ${cur.rev}. The diff below compares against the current version. Approving overwrites newer changes.</div>`:''}<pre class="df">${cur?diff(lines(cur),lines({...e,...n})):'Article missing'}</pre><div class="row"><button class="a">Approve</button><button class="d x">Reject</button></div>`;
  q('#rv').append(box);
  box.querySelector('.a').onclick=async()=>{const b=writeBatch(db);b.set(doc(db,'articles',e.slug,'revs',String(cur.rev)),{body:cur.body,by:cur.authorName||''});b.update(doc(db,'articles',e.slug),{summary:e.summary,type:e.type,body:e.body,rev:cur.rev+1,updated:serverTimestamp()});b.delete(d.ref);await b.commit();box.remove()};
  box.querySelector('.x').onclick=async()=>{await writeBatch(db).delete(d.ref).commit();box.remove()}}}
route();
</script></body></html>
