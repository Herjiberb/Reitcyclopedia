function md(s){const L=s.split('\n');let o='',i=0,p=[];const fp=()=>{if(p.length){o+=`<p>${fmt(p.join(' '))}</p>`;p=[]}},row=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
 while(i<L.length){const l=L[i];let m;
  if(l.startsWith('```')){fp();const c=[];i++;while(i<L.length&&!L[i].startsWith('```'))c.push(L[i++]);i++;o+=`<pre class="cb">${esc(c.join('\n'))}</pre>`;continue}
  if(!l.trim()){fp();i++;continue}
  if(m=l.match(/^(#{3,4})\s+(.+)/)){fp();o+=`<h${m[1].length}>${fmt(m[2])}</h${m[1].length}>`;i++;continue}
  if(/^[-*]\s/.test(l)||/^\d+[.)]\s/.test(l)){fp();const ol=/^\d/.test(l),r=ol?/^\d+[.)]\s/:/^[-*]\s/,it=[];while(i<L.length&&r.test(L[i]))it.push(L[i++].replace(r,''));const t=ol?'ol':'ul';o+=`<${t}>${it.map(x=>`<li>${fmt(x)}</li>`).join('')}</${t}>`;continue}
  if(l.startsWith('> ')){fp();const b=[];while(i<L.length&&L[i].startsWith('> '))b.push(L[i++].slice(2));o+=`<blockquote>${fmt(b.join(' '))}</blockquote>`;continue}
  if(/^---+$/.test(l.trim())){fp();o+='<hr>';i++;continue}
  if(l.includes('|')&&/^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(L[i+1]||'')&&/-/.test(L[i+1])){fp();const h=row(l);i+=2;const rs=[];while(i<L.length&&L[i].includes('|'))rs.push(row(L[i++]));o+=`<div class="tw"><table><tr>${h.map(c=>`<th>${fmt(c)}</th>`).join('')}</tr>${rs.map(r=>`<tr>${r.map(c=>`<td>${fmt(c)}</td>`).join('')}</tr>`).join('')}</table></div>`;continue}
  p.push(l);i++}
 fp();return o}

/* ---- compression: JSON -> gzip -> base64 ---- */
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode(...u.subarray(i,i+8192));return btoa(s)};
const unb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const pipe=async(d,T)=>new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new T('gzip'))).arrayBuffer());
const pack=async o=>b64(await pipe(JSON.stringify(o),CompressionStream));

  if(!force&&IDXAT&&Date.now()-IDXAT<300000)return;
  const had=IDX.rev>0||IDX.e.length>0;
  const run=async()=>{try{const s=await getDoc(IDXD);let ch=false;if(s.exists()){const d=s.data();if(d.rev!==IDX.rev||!had){setIdx(d.rev,d.n,await unpack(d.z));ch=true}}else if(!had)setIdx(0,0,[]);IDXAT=Date.now();await saveIdxCache();IDXCB&&IDXCB();if(ch&&had&&/^(#\/?)?$|^#\/(t|browse)/.test(location.hash))route()}catch(e){}};
  if(had)run();else await run()})()}

function srch(t,lim=15){const n=normQ(t);if(!n)return[];const w=n.split(' '),r=[];

/* One transaction writes article + index + daily counter together, so the index can never drift. Rules enforce the same. */

  const is=await tx.get(IDXD),as=await tx.get(ar),cs=op==='delete'?null:await tx.get(cr);
  const d=is.exists()?is.data():{rev:0,n:0},list=is.exists()?await unpack(d.z):[],cur=as.exists()?as.data():null;
  if(op==='create'&&cur)throw Error('An article with this title already exists.');
  if(op!=='create'&&!cur)throw Error('Article no longer exists.');
  const rev=d.rev+1,rows=list.filter(x=>x[0]!==id);let n=d.n;
  if(op==='create')n++;if(op==='delete')n=Math.max(0,n-1);

  const z=await pack(rows);if(z.length>900000)throw Error('Search index is full. Ask an admin to shard it.');

  tx.set(IDXD,{rev,n,z,last:id});
  if(op==='delete')tx.delete(ar);
  else if(op==='create'){if(c.a>=lim.a)throw Error('Daily limit reached: '+lim.a+' new articles per day.');tx.set(ar,{...meta,rev:1,idxRev:rev,updated:serverTimestamp()});tx.set(cr,{a:c.a+1,e:c.e})}

   tx.set(doc(db,'articles',id,'revs',String(cur.rev)),{body:cur.body,by:cur.authorName||''});
   tx.update(ar,{title:meta.title,titleLower:meta.title.toLowerCase(),summary:meta.summary,type:meta.type,body:meta.body,rev:cur.rev+1,idxRev:rev,updated:serverTimestamp()});tx.set(cr,{a:c.a,e:c.e+1});
   if(meta.drop)tx.delete(meta.drop)}
  out={rev,n,rows}});

  await setDoc(IDXD,{rev,n:rows.length,z:await pack(rows),last:'_rebuild'});setIdx(rev,rows.length,rows);await saveIdxCache();q('#rbs').textContent='Done: '+rows.length+' articles indexed.'}catch(e){q('#rbs').textContent='Failed: '+e.message}}}
/* ---- home (0 reads from the index; trending uses a 30-minute local cache of 3 tiny stat docs) ---- */
async function getStats(){const c=await idb('get','st');if(c&&Date.now()-c.at<1800000)return c;const st=await Promise.all([0,1,2].map(i=>getDoc(doc(db,'stats','s'+i)))),tot={};let views=0;st.forEach(d=>{if(!d.exists())return;const x=d.data();views+=x.t||0;for(const k in x.v||{})tot[k]=(tot[k]||0)+x.v[k]});const o={tot,views,at:Date.now()};await idb('put','st',o);return o}
async function home(){await loadIdx();app.innerHTML=`<div class="hero">${MARK}<h1 class="wm">Reitcyclopedia</h1><p class="tag" id="cn">${(IDX.n||IDX.e.length).toLocaleString()} articles and growing. Free to read, free to write.</p></div>${sbox()}<div class="chips">${Object.keys(TPL).map(k=>`<a class="chip" href="#/t/${k}">${k}</a>`).join('')}<a class="chip" href="#/random">Random article</a></div><div id="hm"></div>`;wireSearch();
 const rec=[...IDX.e].sort((a,b)=>b.u-a.u).slice(0,8),mine=Object.entries(hist).filter(([s])=>BYS[s]).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const L=a=>a.map(([s,n])=>`<a href="#/a/${s}">${esc(titleOf(s)||pretty(s))} <span class="mu">${n?'('+n+')':''}</span></a>`).join('')||'<span class="mu">Nothing yet.</span>';
 q('#hm').innerHTML=`${isAdmin()&&!IDX.e.length?'<div class="card err">The search index is empty. <a href="#/rebuild">Build it now</a>.</div>':''}<div class="grid"><div class="card list"><h3>Trending</h3><div id="tr"><span class="mu">Loading…</span></div></div>
 <div class="card list"><h3>Recently updated</h3>${rec.map(x=>`<a href="#/a/${x.i}">${esc(x.t)}</a>`).join('')||'<span class="mu">No articles yet.</span>'}</div>
 <div class="card list"><h3>Based on your reading</h3>${L(mine)}<p class="mu">Kept only on this device.</p></div>
 <div class="card"><h3>Write for Reitcyclopedia</h3><p class="mu">Anyone with a verified account can publish up to 25 articles and make 15 edits a day on any subject. Stuck? The editor can generate a prompt for an AI chatbot and fill the article in for you to review.</p><a href="#/new"><button>Start an article</button></a> <a href="#/help"><button class="g">Writing guide</button></a></div></div>`;
 try{const s=await getStats(),top=Object.entries(s.tot).filter(([k])=>BYS[k]).sort((a,b)=>b[1]-a[1]).slice(0,8);if(q('#tr'))q('#tr').innerHTML=L(top)+`<p class="mu">${s.views.toLocaleString()} total page views</p>`}catch(e){if(q('#tr'))q('#tr').innerHTML='<span class="mu">Unavailable.</span>'}}
async function rnd(){await loadIdx();if(!IDX.e.length)return home();location.replace('#/a/'+IDX.e[Math.floor(Math.random()*IDX.e.length)].i)}
const chips=()=>`<div class="chips">${Object.keys(TPL).map(k=>`<a class="chip" href="#/t/${k}">${k} <span class="mu">${IDX.e.filter(x=>x.y===k).length}</span></a>`).join('')}</div>`;
async function browse(){await loadIdx();app.innerHTML=`<div class="card"><h1>Browse</h1>${chips()}<h3>Latest articles</h3><div class="list">${[...IDX.e].sort((a,b)=>b.u-a.u).slice(0,50).map(x=>`<a href="#/a/${x.i}"><b>${esc(x.t)}</b> <span class="mu">${esc(x.y)}</span></a>`).join('')||'Nothing here yet.'}</div></div>`}
async function byType(t){if(!TPL[t])return browse();await loadIdx();app.innerHTML=`<div class="card"><h1>${esc(t)} articles</h1>${chips()}<div class="list">${IDX.e.filter(x=>x.y===t).sort((a,b)=>a.k<b.k?-1:1).map(x=>`<a href="#/a/${x.i}"><b>${esc(x.t)}</b> <span class="mu">${esc(x.s.slice(0,100))}</span></a>`).join('')||'No articles of this type yet.'}</div></div>`}
function help(){const ex=x=>`<pre class="cb">${esc(x)}</pre>`;app.innerHTML=`<div class="card"><h1>Writing guide</h1><p>Every article needs a title, a type, a summary of 40 to 500 characters, at least one heading, and at least 150 characters of content. Articles are limited to 50 KB compressed.</p>
<h2>Formatting</h2>${ex('**bold**  *italic*  ~~strike~~  ==highlight==  `code`\n[[Another Article]]  [link text](https://example.com)')}
<p>Paragraphs and dropdown sections also accept these on their own lines:</p>${ex('### Small heading\n- bullet\n1. numbered\n> quote\n---\n| Name | Year |\n|------|------|\n| Moon | 1969 |\n\n```\ncode block\n```')}
<h2>Infobox</h2><p>Add one "Label: Value" per line. Choosing a type pre-fills suggested labels.</p>
<h2>AI article prompt</h2><p>In the editor, click <b>Copy prompt</b>, paste it into any chatbot, tell it the subject and what to cover, then copy its reply and click <b>Paste response</b>. You get a preview to approve before anything is filled in. Always check the facts.</p>
<h2>Limits</h2><p>25 new articles and 20 edits per day. Edits to existing articles are reviewed by an admin before they appear.</p></div>`}
async function search(t){await home();const i=q('#sf').q;i.value=t;i.dispatchEvent(new Event('input'))}

/* ---- read ---- */
async function load(id){const s=await getDoc(doc(db,'articles',id));if(!s.exists())return null;const d=s.data();return{id,...d,...await unpack(d.body)}}
function render(a){let h=`<h1>${esc(a.title)}</h1><div class="mu">${esc(a.type)}</div>`;
 if(a.infobox?.length)h+=`<aside class="info"><h4>${esc(a.title)}</h4><dl>${a.infobox.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${fmt(v)}</dd>`).join('')}</dl></aside>`;
 h+=`<p>${fmt(a.summary)}</p>`;
 for(const b of a.blocks)h+=b.t==='h'?`<h2>${fmt(b.x)}</h2>`:b.t==='p'?md(b.x):b.t==='l'?`<ul>${b.x.split('\n').filter(Boolean).map(i=>`<li>${fmt(i)}</li>`).join('')}</ul>`:`<details><summary>${fmt(b.h||'More')}</summary>${md(b.x)}</details>`;
 return h}
async function view(id){app.innerHTML='<div class="card">Loading…</div>';const al=BYS[id];if(al&&al!==id)return location.replace('#/a/'+al);const a=await load(id);
 if(!a){if(BYS[id]){setIdx(IDX.rev,IDX.n,rowsOf().filter(r=>r[0]!==id));saveIdxCache();loadIdx(true)}app.innerHTML=`<div class="card"><h1>${esc(pretty(id))}</h1><p>This article doesn't exist yet.</p>${user?`<a href="#/new/${id}"><button>Create it</button></a>`:'Sign in to create it.'}</div>`;return}
 track(id);document.title=a.title+' – Reitcyclopedia';
 app.innerHTML=`<div class="card">${render(a)}<div style="clear:both"></div><hr style="border:0;border-top:1px solid var(--ln)"><div class="row mu">Revision ${a.rev} · by ${esc(a.authorName||'unknown')} ${user?`<a href="#/edit/${id}"><button class="g">Edit</button></a>`:''} ${user?'<button class="g" id="rpt">Report</button>':''} ${isAdmin()?'<button class="d" id="dl">Delete</button>':''}</div></div>`;
 if(user)q('#rpt').onclick=()=>report(id,a.title);
 if(isAdmin())q('#dl').onclick=async()=>{if(await uiConfirm('Delete this article?')){try{await txArticle(id,'delete');location.hash='#/'}catch(e){uiAlert(e.message)}}}}

/* ---- editor ---- */
let E,EID=null;const CPI='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-3px"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
async function editor(id){EID=id||null;let a=null;
 if(id){a=await load(id);if(!a)return app.innerHTML='<div class="card">Article not found.</div>'}
 E=a?{title:a.title,type:a.type,summary:a.summary,infobox:a.infobox||[],blocks:a.blocks,base:a.rev}:{title:location.hash.startsWith('#/new/')?pretty(location.hash.slice(7)):'',type:'General',summary:'',infobox:[],blocks:[{t:'h',x:''},{t:'p',x:''}]};
 if(PRE){E={...E,...PRE};PRE=null}
 app.innerHTML=`<div class="card"><h1>${id?'Edit':'New'} article</h1><div class="ai"><div><b>AI article prompt</b><div class="mu">Copy the prompt, paste it into any chatbot, answer its questions, then paste its reply here to review.</div></div><button class="g" id="cp" title="Copy AI prompt">${CPI} Copy prompt</button><button class="g" id="ps">Paste response</button></div>
 ${id&&!isAdmin()?'<p class="mu">Edits are reviewed by an admin before they go live.</p>':''}
 <div class="row"><input id="t" placeholder="Title" value="${esc(E.title)}" maxlength="120"><select id="ty" style="max-width:190px">${Object.keys(TPL).map(k=>`<option${k==E.type?' selected':''}>${k}</option>`).join('')}</select></div>
 <p class="mu">Summary (40–500 characters, required). Use [[Article Title]] for internal links, **bold**, [text](https://url) for external links.</p>
 <textarea id="sm" rows="3">${esc(E.summary)}</textarea>
 <p class="mu">Infobox, one "Label: Value" per line (shown in the side bar).</p>
 <textarea id="ib" rows="5"></textarea>
 <h3 style="margin-top:18px">Content</h3><p class="mu">Paragraphs and dropdowns support Markdown: lists, quotes, tables, code, *italic*, ==highlight==. See Help.</p><div id="bl"></div>
 <div class="row"><button class="g" data-add="h">+ Heading</button><button class="g" data-add="p">+ Paragraph</button><button class="g" data-add="l">+ List</button><button class="g" data-add="c">+ Dropdown</button></div>
 <div id="er" class="err"></div><div class="row"><button id="sv">${id&&!isAdmin()?'Submit edit for review':'Publish'}</button><span class="mu" id="sz"></span></div></div>`;
 q('#ty').onchange=()=>{if(!q('#ib').value.trim())fillIb()};q('#ib').value=E.infobox.map(([k,v])=>k+': '+v).join('\n');if(!E.infobox.length)fillIb();
 drawB();
 q('#bl').oninput=e=>{const i=e.target.closest('.blk').dataset.i;E.blocks[i][e.target.dataset.f]=e.target.value};
 q('#bl').onchange=e=>{if(e.target.dataset.f==='t')drawB()};
 q('#bl').onclick=e=>{const a=e.target.dataset.a,i=+e.target.closest('.blk')?.dataset.i;if(!a)return;const B=E.blocks;if(a==='rm')B.splice(i,1);else{const j=a==='up'?i-1:i+1;if(j<0||j>=B.length)return;[B[i],B[j]]=[B[j],B[i]]}drawB()};
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{E.blocks.push({t:b.dataset.add,x:'',h:''});drawB()});
 q('#cp').onclick=copyAI;q('#ps').onclick=pasteAI;q('#sv').onclick=save}
const fillIb=()=>q('#ib').value=TPL[q('#ty').value].map(k=>k+': ').join('\n');
function drawB(){q('#bl').innerHTML=E.blocks.map((b,i)=>`<div class="blk" data-i="${i}"><div class="row"><select data-f="t" style="max-width:190px">${[['h','Heading'],['p','Paragraph'],['l','List (one per line)'],['c','Dropdown section']].map(([v,n])=>`<option value="${v}"${b.t==v?' selected':''}>${n}</option>`).join('')}</select>${b.t=='c'?`<input data-f="h" placeholder="Dropdown title" value="${esc(b.h||'')}">`:''}<span class="sp"></span><button class="g" data-a="up">↑</button><button class="g" data-a="dn">↓</button><button class="g" data-a="rm">✕</button></div><textarea data-f="x" rows="${b.t=='h'?1:5}">${esc(b.x||'')}</textarea></div>`).join('')}
async function save(){const er=q('#er');er.textContent='';
 try{const title=q('#t').value.trim(),type=q('#ty').value,summary=q('#sm').value.trim();
 const infobox=q('#ib').value.split('\n').map(l=>{const i=l.indexOf(':');return i>0?[l.slice(0,i).trim(),l.slice(i+1).trim()]:null}).filter(x=>x&&x[1]);
 const blocks=E.blocks.filter(b=>(b.x||'').trim()).map(b=>({t:b.t,x:b.x.trim(),...(b.t=='c'?{h:(b.h||'').trim()}:{})}));
 if(title.length<3||title.length>120)throw Error('Title must be 3–120 characters.');
 if(summary.length<40||summary.length>500)throw Error('Summary must be 40–500 characters.');
 if(!blocks.some(b=>b.t==='h'))throw Error('Add at least one heading.');
 if(blocks.reduce((n,b)=>n+b.x.length,0)<150)throw Error('Add at least 150 characters of body content.');
 const body=await pack({infobox,blocks});q('#sz').textContent=Math.round(body.length/1024*10)/10+' KB compressed';
 if(body.length>MAXB)throw Error('Article is over the 50 KB compressed limit. Shorten it.');
 const id=EID||slug(title);if(!id)throw Error('Invalid title.');
 await loadIdx();const own=BYS[slug(title)];if(own&&own!==id)throw Error('Another article already uses that name.');
 const meta={title,titleLower:title.toLowerCase(),type,summary,body,authorUid:user.uid,authorName:user.displayName||''};
 if(!EID){if(BYS[id])throw Error('An article with this title already exists.');await txArticle(id,'create',meta);location.hash='#/a/'+id}
 else if(isAdmin()){await txArticle(id,'update',meta);location.hash='#/a/'+(slug(title)||id)}
 else{const day='d'+new Date().toISOString().slice(0,10).replace(/-/g,''),cr=doc(db,'users',user.uid,'days',day),cs=await getDoc(cr),c=cs.exists()?cs.data():{a:0,e:0};
  if(c.e>=15)throw Error('Daily limit reached: 15 edits per day.');
  const b=writeBatch(db);b.set(doc(collection(db,'edits')),{...meta,updated:serverTimestamp(),slug:id,baseRev:E.base,status:'pending'});b.set(cr,{a:c.a,e:c.e+1});await b.commit();
  app.innerHTML='<div class="card"><h1>Edit submitted</h1><p>An admin will review it soon.</p><a href="#/a/'+id+'">Back to article</a></div>'}
 }catch(e){er.textContent=e.code==='permission-denied'?'Not allowed. You may be over a daily limit or need a verified Google account.':e.message}}

/* ---- admin review (line diff against current revision) ---- */
const lines=o=>[`Title: ${o.title}`,`Type: ${o.type}`,`Summary: ${o.summary}`,...(o.infobox||[]).map(([k,v])=>`[info] ${k}: ${v}`),...o.blocks.flatMap(b=>[`[${b.t}${b.h?' '+b.h:''}]`,...b.x.split('\n')])];
function diff(a,b){const A=new Set(a),B=new Set(b);return [...a.filter(x=>!B.has(x)).map(x=>`<span class="del">− ${esc(x)}</span>`),...b.filter(x=>!A.has(x)).map(x=>`<span class="add">+ ${esc(x)}</span>`)].join('\n')||'No visible changes.'}
async function review(){if(!isAdmin())return app.innerHTML='<div class="card">Admins only.</div>';
 app.innerHTML='<div class="card"><h1>Reported articles</h1><div id="rp">Loading…</div></div><div class="card"><h1>Edit review log</h1><div id="rv">Loading…</div></div>';loadReports();
 const r=await getDocs(query(collection(db,'edits'),where('status','==','pending'),limit(20)));
 if(r.empty)return q('#rv').innerHTML='<p class="mu">No pending edits.</p>';
 q('#rv').innerHTML='';
 for(const d of r.docs){const e=d.data(),cur=await load(e.slug),n=await unpack(e.body),box=document.createElement('div');box.className='blk';
  const stale=cur&&cur.rev!==e.baseRev;
  box.innerHTML=`<b><a href="#/a/${e.slug}">${esc(e.title)}</a></b> <span class="mu">by ${esc(e.authorName)} · based on rev ${e.baseRev}</span>${stale?`<div class="err">Stale: the article is now at rev ${cur.rev}. The diff below compares against the current version. Approving overwrites newer changes.</div>`:''}<pre class="df">${cur?diff(lines(cur),lines({...e,...n})):'Article missing'}</pre><div class="row"><button class="a">Approve</button><button class="d x">Reject</button></div>`;
  q('#rv').append(box);
  box.querySelector('.a').onclick=async()=>{try{await txArticle(e.slug,'update',{title:e.title,type:e.type,summary:e.summary,body:e.body,drop:d.ref});box.remove()}catch(x){uiAlert(x.message)}};
  box.querySelector('.x').onclick=async()=>{await writeBatch(db).delete(d.ref).commit();box.remove()}}}
route();
</script></body></html>
